<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            top: 0;
            position: sticky;

        }

        nav {
            background-color: pink;
            height: 50px;
            padding: 20px;

        }

        ul li {

            padding: 50px;
            display: inline;
            font-size: x-large;
            font-weight: bolder;
            font-family: sans-serif;
        }

        main {
            background-color: black;
            color: white;
            padding: 34px;
        }

        .container {
            background-color: green;
            margin: 12px 34px;
            padding: 55px 23px;
            text-align: center;

        }

        .box {
            background-color: palevioletred;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }


        .text-box {
            padding: 34px;
            border: 2px solid white;
            margin: 50px 34vw;
            font-size: 2em;
            border-radius: 13px;

        }

        .orange-box {
            height: 32px;
            width: 32px;
            background-color: orange;
            border-radius: 60%;
            position: fixed;
            bottom: 12px;
            right: 23px;
        }

        footer {
            height: 100px;
            background-color: bisque;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>HOME</li>
                <li>ABOUT</li>
                <li>CONTACTS</li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div class="text-box">
            <p>Welcome to SIGMA WEB DEVELOPMENT EXPRESS</p>
        </div>
        <div class="orange-box"></div>
    </main>
    <footer>

    </footer>
</body>

</html>
