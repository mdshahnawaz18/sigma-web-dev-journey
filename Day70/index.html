<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 23px;
        }

        .box {
            height: 80px;
            width: 80px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="1" class="box">Box 1</div>
        <div id="2" class="box">Box 2</div>
        <div id="3" class="box">Box 3</div>
        <div id="4" class="box">Box 4</div>
        <div id="5" class="box">Box 5</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
