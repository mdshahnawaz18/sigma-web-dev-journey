<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnails</title>
    <style>
        body {
            display: flex;
            
        }

        .container {
            width: 60vw;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;

        }

        .card {
            border: 1px solid black;
            padding: 10px;
            height: 100px;
            width: 55vw;
            display: flex;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            position: relative;
        }

        .box1 {
            height: 120px;
            width: 160px;
            border-radius: 8px;
         
            position: relative;
        }


        .duration {
        
            position: relative;
            bottom: 20px;
            left: 124px;
            height: 12px;
            font-size: 11px;
            text-align: center;
            width: 30px;
            background-color: black;
            color: white;
            border-radius: 3px;
        }

        .box2 {
            height: 100px;
            width: calc(55vw - 160px);
            padding: 10px;
        }

        .title {
            width: calc(55vw - 170px);
            margin: auto;
            margin-top: 2px;
            height: 30px;
            font-weight: 800;
            font-size: 18px;
        }

        .hero {
            width: calc(55vw - 170px);
            border: 1px solid black;
            margin: auto;
            margin-top: 2px;
            height: 24px;
            display: flex;
        }

        p{
            height: 16px;
            font-size: 14px;
            margin-top: 2px;
            margin-left: 2px;
        }
    </style>
</head>

<body>
    <div class="container" id="videoContainer"></div>

    <script src="script.js"></script>
</body>

</html>
