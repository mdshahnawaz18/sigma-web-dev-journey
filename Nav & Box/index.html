<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        header {
            position: sticky;
            top: 0px;
            border: 2px solid black;
            background-color: bisque;
      
            height: 26px;

        }

        footer {
            position: fixed;

            border: 2px solid black;
            background-color: bisque;
            width: 20%;
            display: flex;
            border-radius: 30%;
            bottom: 0px;
            padding: 5px;
            font-weight: bold;
            text-align: center;

        }


        .primary {

            border: 2px solid black;
            background-color: rgb(159, 255, 239);
            width: 70vw;
            height: 1000px;
        }

        .main {

            margin: 4px;
            padding: 20px;
            border: 2px solid black;
            /* position: relative; */
            background-color: rgb(13, 215, 121);
            height: 60vh;
            display: flex;
            justify-content: space-around;
            /* text-align: center; */
            align-items: center;
        }


        .box {
            border: 2px solid black;
            display: inline-block;

            padding: 140px;
            width: 200px;
            height: 100px;
            background-color: rgb(96, 96, 242);
        }



        ul li {
            list-style-type: none;

            margin-right: 20px;
            display: inline;

        }

        .circle {
            border-radius: 40%;
            padding: 10px 15px;
            background-color: rgb(243, 179, 220);
            right: 30px;
           
            font-weight: bold;
            border: 2px solid black;
            position: fixed;
            bottom: 20px;
        }

        p {
            background-color: yellowgreen;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="primary">
        <header>
            <nav>
                <ul>
                    <li>HOME</li>
                    <li>ABOUT</li>
                    <li>CONTACTS</li>
                </ul>
            </nav>
        </header>
        <div class="main">
            <div class="box">A</div>
            <div class="box">B</div>
        </div>

        <div class="welcome"></div>

        <span class="circle">
            Shahnawaz
        </span>
        <footer>
            <div>
                Thank You For Coming!☺️
            </div>
        </footer>
    </div>
</body>

</html>
