<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filter</title>
    <style>
       
.img1{
    
    /* filter: blur(1px);
    filter: brightness(10); */
    /* filter: contrast(35); */
    filter: drop-shadow(16px 16px 20px blue);
}
.img2{
    /* filter:grayscale(50%) ; */
    filter: hue-rotate(60deg);
}
.img3{
    /* filter: invert();
    filter: none; */
    /* filter: opacity(55%); */
    /* filter: sepia(65%); */
    filter: saturate(30%);

}
    </style>
</head>
<body>
    <div class="container">
        <div class="img1">
        <img src="https://m.media-amazon.com/images/M/MV5BZDk1ZmU0NGYtMzQ2Yi00N2NjLTkyNWEtZWE2NTU4NTJiZGUzXkEyXkFqcGdeQXVyMTExNDQ2MTI@._V1_FMjpg_UX1000_.jpg" alt="">
        </div>
        <div class="img2">
            <img src="https://files.prokerala.com/news/photos/imgs/800/barbados-india-s-virat-kohli-poses-with-trophy-1753397.jpg" alt="">
        </div>

        <div class="img3">
            <img src="https://i2.cinestaan.com/image-bank/1500-1500/185001-186000/185363.jpg" alt="">
        </div>
    </div>
</body>
</html>
