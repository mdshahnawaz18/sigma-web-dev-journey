<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Spotify - Web Player: Music for everyone</title>
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="close"><img src="img/close.svg" alt=""></div>
            <div class="home">
                <div class="logo">
                    <img src="img/logo.svg" alt="">
                </div>


                <ul>
                    <li id="homebtn"><img src="img/home.svg" alt="">Home</li>
                    <li>
                        <img src="img/search.svg" alt="">
                        <input type="search" name="search" id="search" placeholder="Search">
                    </li>
                </ul>
            </div>
            <div class="library">
                <div class="heading">
                    <img width="30px" src="img/playlist.svg" alt="">
                    <h2>Your Library</h2>
                </div>
                <div class="songList">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right">
            <header>
                <nav>
                    <img width="40" class="hamburger" src="img/hamburger.svg" alt="">
                    <svg class="svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <svg class="svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </nav>
                <div class="slbtn">
                    <div class="drop">
                        <select name="lang" id="1">
                            <option value="en">English</option>
                            <option value="hi">Hindi</option>
                            <option value="Fr">French</option>
                            <option value="urdu">Urdu</option>
                        </select>
                    </div>
                    <div class="signupbtn">
                        <div>Sign up</div>
                    </div>
                    <div class="loginbtn">
                        <div>Log in</div>
                    </div>
                </div>
            </header>
            <div class="spotifyPlaylists">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer">



                </div>
            </div>
            <div class="playbar">
                <div class="songinfo"></div>
                <div class="songbuttons">
                    <img id="prev" width="35" src="img/prevsong.svg" alt="">
                    <img id="play" width="35" src="img/play.svg" alt="">
                    <img id="next" width="35" src="img/nextsong.svg" alt="">
                </div>
                <div class="timevol">
                    <div class="songtime"></div>
                    <div class="volume">
                        <img src="img/volume.svg" alt="">
                        <input type="range" name="" id="">
                    </div>
                </div>
                <div class="seekbar">
                </div>
                <div class="circle"></div>
            </div>
        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
