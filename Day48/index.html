<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .container {
            width: 80vw;
            height: 80vh;
            /* display: flex;
            justify-content: flex-start; */
            margin: auto;
            background-color: aquamarine;
            position: relative;
        }
        .img{
            font-size: 80px;
        }
        .box {
            background-color: rgb(245, 237, 5);
            width: 60px;
            height: 60px;

            position: absolute;
            bottom: 0;
            left: 0;
            font-family: sans-serif;
            border-radius: 100%;
            color: crimson;
            display: flex;

            justify-content: center;
            align-items: center;

            animation: animateX 10s linear infinite, animateY 1s ease-out infinite alternate;
        }

        @keyframes animateX {
            from {
                left: 0;
            }

            to {
                left: 100%;
                
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }

            to {
                bottom: 60%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            <div class="img">🏀
                </div>
        </div>
    </div>
</body>

</html>
