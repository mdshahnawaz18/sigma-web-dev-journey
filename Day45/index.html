<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>
    <style>
        .container{
            background-color: aquamarine;
            width: 50vw;
            height: 40vh;
        }
        .box{

            background-color: bisque;
            width: 5vw;
            height: 4vh;
            /* transition-property: transform background-color;
            transition-duration: 3s;
            transition-timing-function:  cubic-bezier(0, 1.31, 0.58, 1);
            transition-delay: 1s; */
            transition: all 3s cubic-bezier(0, 1.31, 0.58, 1) 1s ;



        }
        .translate{
            transform: translateX(10vw) translateY(10vh) scale(2);
            background-color: rgb(244, 114, 70);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>
</html>
