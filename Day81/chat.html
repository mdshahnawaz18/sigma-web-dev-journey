<!DOCTYPE html>
<html>
<head>
  <title>Hacking Simulator</title>
  <style>
    body {
      background-color: black;
      color: #00FF00;
      font-family: monospace;
      padding: 20px;
      font-size: 20px;
    }
    .blinking {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="output"></div>

  <script>
    const messages = [
      "Initializing Hacking",
      "Reading your Files",
      "Password files Detected",
      "Sending all passwords and personal files to server",
      "Cleaning up"
    ];

    const output = document.getElementById("output");

    // Blinking dots logic
    function getBlinkingDots() {
      let dots = "";
      const count = Math.floor(Math.random() * 3) + 1; // 1 to 3 dots
      for (let i = 0; i < count; i++) {
        dots += ".";
      }
      return dots;
    }

    // Show each message with delay
    async function showMessages() {
      for (let msg of messages) {
        const line = document.createElement("div");
        line.textContent = msg;
        output.appendChild(line);

        // Blinking dots simulation
        for (let i = 0; i < 5; i++) {
          line.textContent = msg + getBlinkingDots();
          await new Promise(resolve => setTimeout(resolve, 500));
        }

        await new Promise(resolve => setTimeout(resolve, Math.random() * 6000 + 1000)); // 1-7 sec
      }

      const done = document.createElement("div");
      done.textContent = "✅ Hacking Complete!";
      output.appendChild(done);
    }

    showMessages();
  </script>
</body>
</html>
